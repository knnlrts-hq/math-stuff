<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lill's Method Explorer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;500;700&family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0f14;--sf:#151921;--sf2:#1c2230;--bd:#2a3040;--tx:#d8dce6;--txd:#7a839a;
  --ac:#4fc3a0;--a2:#e8a44a;--la:#ff4466;--tp:#4a8aff;--pu:#a78bfa}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh}
.hdr{padding:24px 36px 0;max-width:1440px;margin:0 auto}
.hdr h1{font-family:'Crimson Pro',serif;font-weight:300;font-size:2.4em;color:#fff}
.hdr h1 b{color:var(--ac);font-weight:300}
.hdr p{font-size:.9em;color:var(--txd);margin-top:4px;max-width:720px;line-height:1.55}
.tbar{display:flex;gap:2px;padding:16px 36px 0;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.tb{padding:8px 16px;background:0 0;border:1px solid transparent;border-bottom:none;color:var(--txd);
  font-family:'DM Sans',sans-serif;font-size:.8em;font-weight:500;cursor:pointer;border-radius:7px 7px 0 0;transition:.15s}
.tb:hover{background:#1f2737;color:var(--tx)}.tb.on{background:var(--sf);color:var(--ac);border-color:var(--bd)}
.wrap{max-width:1440px;margin:0 auto;padding:0 36px 36px}
.pn{display:none;background:var(--sf);border:1px solid var(--bd);border-radius:0 10px 10px 10px;padding:22px}
.pn.on{display:block}
.row{display:flex;gap:20px;flex-wrap:wrap}.cc{flex:1;min-width:360px}.cr{width:320px;min-width:260px}
canvas{width:100%;display:block;border-radius:7px;background:var(--bg);border:1px solid var(--bd);cursor:crosshair}
label{display:block;font-size:.76em;color:var(--txd);margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],select{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--bd);
  border-radius:5px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:.86em;outline:0}
input:focus,select:focus{border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);margin:2px 0}
.cg{margin-bottom:12px}
.ib{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:12px 14px;margin-top:9px;font-size:.82em;line-height:1.55}
.ib h4{font-family:'Crimson Pro',serif;font-weight:500;font-size:1.02em;margin-bottom:4px;color:#fff}
.m{font-family:'JetBrains Mono',monospace;color:var(--ac);font-size:.9em}
.v{font-family:'JetBrains Mono',monospace;color:var(--a2)}
.ins{border-left:3px solid var(--ac);padding:8px 12px;background:#4fc3a008;border-radius:0 5px 5px 0;
  margin-top:9px;font-size:.8em;line-height:1.55;color:var(--txd)}
.ins b{color:var(--ac);font-weight:500}
.ins.w{border-left-color:var(--a2)}.ins.w b{color:var(--a2)}
.bt{padding:6px 14px;background:var(--ac);color:var(--bg);border:none;border-radius:5px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:.8em;cursor:pointer;transition:.12s}
.bt:hover{filter:brightness(1.15)}.bt:disabled{opacity:.4;cursor:default;filter:none}
.bs{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}.bs:hover{background:var(--bd)}
.rb{display:inline-block;padding:2px 8px;border-radius:10px;font-family:'JetBrains Mono',monospace;
  font-size:.78em;margin:2px 2px 2px 0;color:#fff}
.lg{display:flex;gap:12px;margin-top:7px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:4px;font-size:.74em;color:var(--txd)}
.ld{width:9px;height:9px;border-radius:50%}
.pd{font-family:'JetBrains Mono',monospace;font-size:.88em;color:var(--ac);padding:4px 0}
.fb{display:flex;gap:4px;flex-wrap:wrap}
.ht{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:.8em;margin-top:7px}
.ht td,.ht th{padding:4px 8px;border:1px solid var(--bd);text-align:center}
.ht th{background:var(--sf2);color:var(--txd);font-weight:500}
@media(max-width:900px){.row{flex-direction:column}.cr{width:100%}.tbar,.wrap{padding-left:12px;padding-right:12px}
  .hdr{padding:16px 12px 0}.hdr h1{font-size:1.6em}}
</style>
</head>
<body>
<div class="hdr">
  <h1>Lill's <b>Method</b> Explorer</h1>
  <p>Solve polynomial equations by shooting lasers at turtles — an interactive guide to Eduard Lill's graphical method (1867).</p>
</div>
<div class="tbar" id="tbar"></div>
<div class="wrap" id="wrap"></div>

<script>
// ============ MATH ============
const DIR=[[1,0],[0,-1],[-1,0],[0,1]];
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function supN(n){return n<2?(n===1?'x':''):('x'+String(n).split('').map(d=>SUP[+d]).join(''))}
function parseC(s){return s.split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v))}
function evalP(c,x){let r=0;for(const v of c)r=r*x+v;return r}
function horner(c,x){const s=[c[0]];for(let i=1;i<c.length;i++)s.push(s[s.length-1]*x+c[i]);return s}
function deflate(c,r){const q=[c[0]];for(let i=1;i<c.length-1;i++)q.push(q[i-1]*r+c[i]);return q}
function polyStr(c){
  if(!c.length)return'0';const d=c.length-1;let p=[];
  for(let i=0;i<c.length;i++){const v=c[i],pw=d-i;if(!v)continue;
    let s='';if(!i){s=(v===-1&&pw)?'−':(v===1&&pw)?'':String(v)}
    else{const a=Math.abs(v);s=(v<0?' − ':' + ');if(a!==1||!pw)s+=a}
    s+=supN(pw);p.push(s)}return p.join('')||'0'}
function tPath(c){const p=[{x:0,y:0}];for(let i=0;i<c.length;i++){const d=DIR[i%4],pr=p[p.length-1];
  p.push({x:pr.x+d[0]*c[i],y:pr.y+d[1]*c[i]})}return p}
function laser(c,slope){
  const tp=tPath(c),n=c.length,lp=[{x:tp[0].x,y:tp[0].y}];let dx=1,dy=-slope;
  for(let i=0;i<n-1;i++){const sd=DIR[(i+1)%4],sp=tp[i+1],pv=lp[lp.length-1];let hx,hy;
    if(sd[0]!==0){if(Math.abs(dy)<1e-15)return{lp,hit:false,dist:1e9};const t=(sp.y-pv.y)/dy;hx=pv.x+t*dx;hy=sp.y}
    else{if(Math.abs(dx)<1e-15)return{lp,hit:false,dist:1e9};const t=(sp.x-pv.x)/dx;hx=pv.x+t*dx;hy=pv.y+t*dy}
    lp.push({x:hx,y:hy});const od=dx;dx=dy;dy=-od}
  const L=lp[lp.length-1],E=tp[tp.length-1];return{lp,hit:Math.hypot(L.x-E.x,L.y-E.y)<.05,dist:Math.hypot(L.x-E.x,L.y-E.y)}}
function findRoots(c,lo,hi,step){
  lo=lo||(-8);hi=hi||(8);step=step||(.01);
  const R=[];let pv=evalP(c,lo);
  for(let x=lo+step;x<=hi;x+=step){const v=evalP(c,x);
    if(pv*v<=0){let a=x-step,b=x;for(let i=0;i<40;i++){const m=(a+b)/2,vm=evalP(c,m);
      if(Math.abs(vm)<1e-12){a=b=m;break}if(vm*evalP(c,a)<0)b=m;else a=m}
      const r=(a+b)/2;if(!R.some(rr=>Math.abs(rr-r)<.01))R.push(r)}pv=v}return R}
function binomRow(n){const r=[1];for(let k=1;k<=n;k++)r.push(r[r.length-1]*(n-k+1)/k);return r}

// ============ DRAW ============
const cvCache={};
function setupCv(cv){
  const id=cv.id;
  // Lock CSS dimensions from the HTML attributes on first call, so buffer changes never affect layout
  if(!cv.style.width)cv.style.width='100%';
  if(!cv.style.height)cv.style.height=(cv.getAttribute('height')||480)+'px';
  const r=cv.getBoundingClientRect();if(r.width<1)return null;
  const dpr=devicePixelRatio||1,nw=Math.round(r.width*dpr),nh=Math.round(r.height*dpr);
  const cached=cvCache[id];
  if(cached&&cached.pw===nw&&cached.ph===nh){
    cached.ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx:cached.ctx,w:r.width,h:r.height}}
  cv.width=nw;cv.height=nh;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  cvCache[id]={ctx,pw:nw,ph:nh};return{ctx,w:r.width,h:r.height}}
function invalidateCv(){for(const k in cvCache)delete cvCache[k]}
function w2c(p,o){return{x:o.ox+p.x*o.s,y:o.oy+p.y*o.s}}
function autoS(pts,w,h,pad){pad=pad||70;if(!pts.length)return{ox:w/2,oy:h/2,s:40};
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  const s=Math.min((w-pad*2)/(x1-x0||1),(h-pad*2)/(y1-y0||1),80);
  return{ox:w/2-(x0+x1)/2*s,oy:h/2-(y0+y1)/2*s,s}}
function grid(ctx,w,h,o){ctx.strokeStyle='#1a2030';ctx.lineWidth=1;
  for(let x=o.ox%o.s;x<w;x+=o.s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=o.oy%o.s;y<h;y+=o.s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.strokeStyle='#2a3550';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,o.oy);ctx.lineTo(w,o.oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(o.ox,0);ctx.lineTo(o.ox,h);ctx.stroke()}
function extLines(ctx,pts,o){ctx.save();ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  for(let i=0;i<pts.length-1;i++){const a=w2c(pts[i],o),b=w2c(pts[i+1],o),dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);
    if(l<.5)continue;const nx=dx/l,ny=dy/l;ctx.beginPath();ctx.moveTo(a.x-nx*4e3,a.y-ny*4e3);ctx.lineTo(a.x+nx*4e3,a.y+ny*4e3);ctx.stroke()}
  ctx.restore()}
function drawPath(ctx,pts,o,col,lw){col=col||'#4a8aff';lw=lw||2.5;if(pts.length<2)return;
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash([]);ctx.beginPath();let p=w2c(pts[0],o);ctx.moveTo(p.x,p.y);
  for(let i=1;i<pts.length;i++){p=w2c(pts[i],o);ctx.lineTo(p.x,p.y)}ctx.stroke();
  ctx.fillStyle=col;for(let i=0;i<pts.length-1;i++){const a=w2c(pts[i],o),b=w2c(pts[i+1],o),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,
    dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);if(l<14)continue;const nx=dx/l,ny=dy/l;ctx.beginPath();
    ctx.moveTo(mx+nx*5,my+ny*5);ctx.lineTo(mx-nx*3-ny*3.5,my-ny*3+nx*3.5);ctx.lineTo(mx-nx*3+ny*3.5,my-ny*3-nx*3.5);ctx.fill()}}
function drawLaser(ctx,pts,o,col){col=col||'#ff4466';if(pts.length<2)return;
  ctx.save();ctx.strokeStyle=col+'40';ctx.lineWidth=5;ctx.setLineDash([]);ctx.beginPath();let p=w2c(pts[0],o);ctx.moveTo(p.x,p.y);
  for(let i=1;i<pts.length;i++){p=w2c(pts[i],o);ctx.lineTo(p.x,p.y)}ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();p=w2c(pts[0],o);ctx.moveTo(p.x,p.y);
  for(let i=1;i<pts.length;i++){p=w2c(pts[i],o);ctx.lineTo(p.x,p.y)}ctx.stroke();
  ctx.fillStyle=col;for(let i=1;i<pts.length-1;i++){p=w2c(pts[i],o);ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.restore()}
function dot(ctx,pt,o,col,r,lbl){r=r||5;const p=w2c(pt,o);ctx.fillStyle=col+'40';ctx.beginPath();ctx.arc(p.x,p.y,r+3,0,6.3);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.3);ctx.fill();
  if(lbl){ctx.fillStyle=col;ctx.font='600 10px "DM Sans"';ctx.fillText(lbl,p.x+r+3,p.y+3)}}
function dashedLine(ctx,a,b,o,col){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.3;ctx.setLineDash([6,4]);
  const pa=w2c(a,o),pb=w2c(b,o);ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();ctx.restore()}

// ============ TABS ============
const TABS=['Lill\'s Method','Quadratic · Thales','Transformations · Origami','Iterative Deflation','Why It Works','Pascal\'s Triangle'];
let cur=0,built=new Set();
function init(){
  const bar=document.getElementById('tbar'),wr=document.getElementById('wrap');
  TABS.forEach((t,i)=>{const b=document.createElement('button');b.className='tb'+(i?'':' on');b.textContent=t;
    b.onclick=()=>go(i);bar.appendChild(b)});
  TABS.forEach((_,i)=>{const d=document.createElement('div');d.className='pn'+(i?'':' on');d.id='p'+i;wr.appendChild(d)});
  go(0);
}
function go(i){cur=i;document.querySelectorAll('.tb').forEach((t,j)=>t.classList.toggle('on',j===i));
  document.querySelectorAll('.pn').forEach((p,j)=>p.classList.toggle('on',j===i));
  if(!built.has(i)){built.add(i);builders[i]()}
  delete cvCache['c'+i];
  requestAnimationFrame(()=>updaters[i]())}
function $(id){return document.getElementById(id)}

// ============ P0: MAIN ============
function buildP0(){$('p0').innerHTML=`
<div class="ins" style="margin-top:0;margin-bottom:12px"><b>Drag on the canvas</b> or use the slider to aim the laser.
  The turtle walks the blue path; the laser bounces at 90° off each segment line. When it hits the endpoint, <b>−tan(θ) is a root</b>.</div>
<div class="row"><div class="cc"><canvas id="c0" height="480"></canvas>
  <div class="lg"><div class="li"><div class="ld" style="background:#4a8aff"></div>Turtle</div>
    <div class="li"><div class="ld" style="background:#ff4466"></div>Laser</div>
    <div class="li"><div class="ld" style="background:#4fc3a0"></div>Start</div>
    <div class="li"><div class="ld" style="background:#e8a44a"></div>End</div></div>
</div><div class="cr">
  <div class="cg"><label>Coefficients (high→low)</label><input type=text id=i0 value="1, 5, 7, 3"></div>
  <div class="cg"><label>Polynomial</label><div class="pd" id=pd0></div></div>
  <div class="cg"><label>Slope: <span id=sv0>1.00</span></label><input type=range id=sl0 min=-6 max=6 step=.02 value=1></div>
  <div class="cg"><label>Presets</label><div class="fb" id=pr0></div></div>
  <div class="ib"><h4>Status</h4><div id=st0></div><div id=fr0></div></div>
  <div class="ins"><b>Key insight:</b> The signed distance from the laser's final point to the turtle's endpoint equals p(−tan θ). A hit means p(x)=0!</div>
</div></div>`;
  const P=[['1,5,7,3','x³+5x²+7x+3'],['1,-6,11,-6','x³−6x²+11x−6'],['1,0,-1','x²−1'],
    ['1,2,-5,-6','x³+2x²−5x−6'],['3,5,-2','3x²+5x−2'],['1,0,0,0,-1','x⁴−1']];
  const box=$('pr0');P.forEach(([v,l])=>{const b=document.createElement('button');b.className='bt bs';b.textContent=l;
    b.onclick=()=>{$('i0').value=v;upP0()};box.appendChild(b)});
  $('i0').oninput=upP0;$('sl0').oninput=upP0;
  let drag=false;const cv=$('c0');
  cv.onmousedown=e=>{drag=true;aimP0(e)};cv.onmousemove=e=>{if(drag)aimP0(e)};
  document.addEventListener('mouseup',()=>drag=false);
  cv.ontouchstart=e=>{e.preventDefault();drag=true;aimP0(e.touches[0])};
  cv.ontouchmove=e=>{e.preventDefault();if(drag)aimP0(e.touches[0])};cv.ontouchend=()=>drag=false;
}
function aimP0(e){const cv=$('c0'),r=cv.getBoundingClientRect(),c=parseC($('i0').value);if(c.length<2)return;
  const tp=tPath(c),o=autoS(tp,r.width,r.height),sp=w2c(tp[0],o),dx=e.clientX-r.left-sp.x,dy=e.clientY-r.top-sp.y;
  if(Math.abs(dx)>5){$('sl0').value=Math.max(-6,Math.min(6,-dy/dx));upP0()}}
function upP0(){const c=parseC($('i0').value);if(c.length<2)return;$('pd0').textContent=polyStr(c);
  const slope=+$('sl0').value;$('sv0').textContent=slope.toFixed(2);
  const cv=$('c0'),S=setupCv(cv);if(!S)return;const{ctx,w,h}=S;
  const tp=tPath(c),o=autoS(tp,w,h);ctx.clearRect(0,0,w,h);grid(ctx,w,h,o);extLines(ctx,tp,o);drawPath(ctx,tp,o);
  const res=laser(c,slope);drawLaser(ctx,res.lp,o);
  dot(ctx,tp[0],o,'#4fc3a0',6,'Start');dot(ctx,tp[tp.length-1],o,'#e8a44a',6,'End');
  if(res.lp.length>1)dot(ctx,res.lp[res.lp.length-1],o,'#ff4466',3);
  const x=-slope,pv=evalP(c,x);
  let s=`Slope=<span class="v">${slope.toFixed(3)}</span> → x=<span class="v">${x.toFixed(3)}</span>, p(x)=<span class="v">${pv.toFixed(5)}</span><br>`;
  s+=res.hit?'<span style="color:var(--ac);font-weight:600">✓ HIT — root found!</span>':`Dist: <span class="v">${(res.dist||0).toFixed(4)}</span>`;
  $('st0').innerHTML=s;
  const roots=findRoots(c);let rh='';
  if(roots.length){rh='<div style="margin-top:5px;font-size:.8em;color:var(--txd)">Real roots:</div>';
    roots.forEach(r=>rh+=`<span class="rb" style="background:var(--la)">${r.toFixed(4)}</span> `)}
  $('fr0').innerHTML=rh}

// ============ P1: THALES ============
function buildP1(){$('p1').innerHTML=`
<div class="ins" style="margin-top:0;margin-bottom:12px">For <b>quadratics</b>, connect start and end as a diameter → draw circle.
  By <b>Thales' theorem</b>, intersections with the middle segment line give right-angle paths = roots. No aiming needed!</div>
<div class="row"><div class="cc"><canvas id="c1" height="480"></canvas>
  <div class="lg"><div class="li"><div class="ld" style="background:#4a8aff"></div>Turtle</div>
    <div class="li"><div class="ld" style="background:#a78bfa"></div>Thales circle</div>
    <div class="li"><div class="ld" style="background:#ff4466"></div>Root paths</div></div>
</div><div class="cr">
  <div class="cg"><label>ax² + bx + c</label><div style="display:flex;gap:7px">
    <div style="flex:1"><label>a</label><input type=number id=qa value=1></div>
    <div style="flex:1"><label>b</label><input type=number id=qb value=3></div>
    <div style="flex:1"><label>c</label><input type=number id=qc value=2></div></div></div>
  <div class="cg"><label>Examples</label><div class="fb" id=pr1></div></div>
  <div class="ib" id=ti1></div>
  <div class="ins"><b>No intersections?</b> The discriminant is negative → only complex roots. The circle exists but never touches the middle line.</div>
</div></div>`;
  [['1,3,2','x²+3x+2'],['1,0,-4','x²−4'],['3,5,-2','3x²+5x−2'],['1,-5,6','x²−5x+6'],['1,2,5','x²+2x+5 (cmplx)']].forEach(([v,l])=>{
    const b=document.createElement('button');b.className='bt bs';b.textContent=l;
    b.onclick=()=>{const cc=parseC(v);$('qa').value=cc[0];$('qb').value=cc[1];$('qc').value=cc[2];upP1()};$('pr1').appendChild(b)});
  $('qa').oninput=$('qb').oninput=$('qc').oninput=upP1}
function upP1(){const a=+$('qa').value||0,b=+$('qb').value||0,c=+$('qc').value||0;if(!a)return;
  const co=[a,b,c],cv=$('c1'),S=setupCv(cv);if(!S)return;const{ctx,w,h}=S;
  const tp=tPath(co),o=autoS(tp,w,h,90);ctx.clearRect(0,0,w,h);grid(ctx,w,h,o);extLines(ctx,tp,o);drawPath(ctx,tp,o);
  const A=tp[0],E=tp[2],cx=(A.x+E.x)/2,cy=(A.y+E.y)/2,rad=Math.hypot(E.x-A.x,E.y-A.y)/2;
  const cc=w2c({x:cx,y:cy},o);ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(cc.x,cc.y,rad*o.s,0,6.3);ctx.stroke();
  const sa=w2c(A,o),ea=w2c(E,o);ctx.strokeStyle='#a78bfa40';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(sa.x,sa.y);ctx.lineTo(ea.x,ea.y);ctx.stroke();ctx.setLineDash([]);
  const segX=tp[1].x,d2=segX-cx,disc=rad*rad-d2*d2;
  let html=`<h4>Thales Construction</h4><div class="pd">${polyStr(co)} = 0</div>

    if(last||N<=7){const sp=w2c(p[0],o);ctx.fillStyle=col;ctx.font='bold 9px "JetBrains Mono"';ctx.textAlign='right';
      ctx.fillText('n='+n,sp.x-7,sp.y+3);ctx.textAlign='left'}}
  if(paths.length){const L=paths[paths.length-1];dot(ctx,L.p[0],o,'#4fc3a0',4,'');dot(ctx,L.p[L.p.length-1],o,'#e8a44a',4,'');
    if(N>=1){const res=laser(L.c,1);if(res.hit)drawLaser(ctx,res.lp,o,'#ff446660')}}
  let html='<h4>Pascal Rows as Turtle Paths</h4>';
  for(let n=0;n<=N;n++){const r=binomRow(n);html+=`<div style="font-family:'JetBrains Mono',monospace;font-size:.78em;color:${cg[n]}">n=${n}: [${r.join(', ')}] → (1+x)${supN(n)}</div>`}
  $('ti5').innerHTML=html;
  let pt='<h4>Pascal\'s Triangle</h4><div style="text-align:center;font-family:\'JetBrains Mono\',monospace;font-size:.72em;line-height:1.7">';
  for(let n=0;n<=Math.min(N,10);n++){const r=binomRow(n);pt+=`<div style="color:${cg[n]}">`;
    r.forEach(v=>pt+=`<span style="display:inline-block;width:28px">${v}</span>`);pt+='</div>'}
  pt+='</div>';$('pt5').innerHTML=pt}

const updaters=[upP0,upP1,upP2,upP3,upP4,upP5];
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{invalidateCv();if(built.has(cur))updaters[cur]()},150)});
init();
</script>
